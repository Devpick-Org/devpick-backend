# 로컬 전용: 앱이 Docker 안의 Redis 컨테이너에 붙도록 함 (ElastiCache 없이 개발할 때)
# docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpick-redis-local}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpick-redis-local}", "ping"]
      interval: 5s
      retries: 10

  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 로컬 Docker Redis는 standalone — elasticache 프로필 끔 (Dockerfile 기본 docker 만)
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpick-redis-local}
