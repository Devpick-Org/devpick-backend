spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://localhost:5432/devpick
    username: ${DB_USERNAME:devpick}
    password: ${DB_PASSWORD:devpick}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      platform: postgresql
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}

ai-server:
  url: ${AI_SERVER_URL:http://localhost:8000}
  timeout-ms: ${AI_SERVER_TIMEOUT_MS:90000}
  internal-key: ${AI_SERVER_INTERNAL_KEY:}

oauth:
  frontend-base-url: ${FRONTEND_URL:http://localhost:3000}
  github:
    client-id: ${GITHUB_CLIENT_ID:local-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:local-github-client-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
    redirect-uri: ${FRONTEND_URL:http://localhost:3000}/auth/google/callback

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

resend:
  api-key: ${RESEND_API_KEY:local-dummy-key}
brevo:
  sender-email: ${BREVO_SENDER_EMAIL:parkhyun9859@gmail.com}

logging:
  level:
    com.devpick: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  auth:
    cookie-secure: false
    refresh-token-same-site: Lax
    has-session-same-site: Lax

springdoc:
  server-url: http://localhost:8080

# 로컬에서만 추가 오리진이 필요할 때만 설정 (예: ngrok). 비우면 CorsConfig 기본 목록만 사용.
cors:
  extra-origin: ${CORS_EXTRA_ORIGIN:}
