spring:
  profiles:
    active: local
  application:
    name: devpick-backend
  # 모든 프로파일 공통 — 미설정 시 기본 max-file-size=1MB 로 1.5MB 첨부가 413 처리될 수 있음 (DP-346)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

# 운영 수동 배치: WEEKLY_REPORT_TRIGGER_KEY 설정 시 POST /internal/reports/weekly/run-batch + X-Internal-Key
app:
  weekly-report:
    trigger-key: ${WEEKLY_REPORT_TRIGGER_KEY:}
  resume:
    # Base64(AES-256-GCM 키 32바이트). 비우면 개발용으로 평문 저장(운영에서는 반드시 설정).
    encryption-key: ${RESUME_ENCRYPTION_KEY:}
  # 로컬(http://localhost)에서는 cookie-secure=false + Lax 조합 필요(브라우저가 Secure 쿠키를 http에 저장하지 않음)
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    refresh-token-same-site: ${AUTH_REFRESH_SAME_SITE:None}
    has-session-same-site: ${AUTH_HAS_SESSION_SAME_SITE:Lax}

# Actuator: EC2/로드밸런서에서 /actuator/health 사용 시 노출 필요
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
