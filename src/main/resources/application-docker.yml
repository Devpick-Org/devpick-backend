server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:devpick}
    username: ${DB_USERNAME:devpick}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      platform: postgresql
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

resend:
  api-key: ${RESEND_API_KEY}
# Brevo 발신에 쓸 이메일(Brevo에서 검증된 발신자). 기본: parkhyun9859@gmail.com
brevo:
  sender-email: ${BREVO_SENDER_EMAIL:parkhyun9859@gmail.com}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}

ai-server:
  url: ${AI_SERVER_URL:http://ai-server:8000}
  timeout-ms: ${AI_SERVER_TIMEOUT_MS:90000}
  internal-key: ${AI_SERVER_INTERNAL_KEY:}

oauth:
  frontend-base-url: ${FRONTEND_URL:http://localhost:3000}
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${FRONTEND_URL:http://localhost:3000}/auth/google/callback

cors:
  extra-origin: ${CORS_EXTRA_ORIGIN:}

app:
  weekly-report:
    trigger-key: ${WEEKLY_REPORT_TRIGGER_KEY:}

logging:
  level:
    com.devpick: INFO

---
# Docker Redis 컨테이너(로컬 compose) 전용 — elasticache 프로필이 없을 때만 적용 (EC2는 application-elasticache.yml 클러스터)
spring:
  config:
    activate:
      on-profile: "docker & !elasticache"
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
