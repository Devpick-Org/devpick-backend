server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:devpick}
    username: ${DB_USERNAME:devpick}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

aws:
  region: ${AWS_REGION:ap-northeast-2}

resend:
  api-key: ${RESEND_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

ai-server:
  url: ${AI_SERVER_URL:http://ai-server:8000}
  timeout-ms: ${AI_SERVER_TIMEOUT_MS:10000}
  internal-key: ${AI_SERVER_INTERNAL_KEY:}

oauth:
  frontend-base-url: ${FRONTEND_URL:http://localhost:3000}
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${FRONTEND_URL:http://localhost:3000}/auth/google/callback

cors:
  extra-origin: ${CORS_EXTRA_ORIGIN:}

logging:
  level:
    com.devpick: INFO
