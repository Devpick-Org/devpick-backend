# EC2/배포: PostgreSQL + 앱만. Redis는 AWS ElastiCache 사용 — .env 에 REDIS_HOST 등 설정.
# 로컬에서 Docker Redis 컨테이너를 쓰려면: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devpick
      POSTGRES_USER: devpick
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpick"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,elasticache
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-devpick}
      DB_USERNAME: ${DB_USERNAME:-devpick}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: 3600000
      JWT_REFRESH_TOKEN_EXPIRY: 604800000
      RESEND_API_KEY: ${RESEND_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Vercel 프리뷰 URL 등 코드에 없는 origin — 비우면 CorsConfig 기본 목록만 사용
      CORS_EXTRA_ORIGIN: ${CORS_EXTRA_ORIGIN:-}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://host.docker.internal:8000}
      AI_SERVER_TIMEOUT_MS: ${AI_SERVER_TIMEOUT_MS:-90000}
      AI_SERVER_INTERNAL_KEY: ${AI_SERVER_INTERNAL_KEY:-}
      WEEKLY_REPORT_TRIGGER_KEY: ${WEEKLY_REPORT_TRIGGER_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      ALADIN_TTB_KEY: ${ALADIN_TTB_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    dns:
      - 172.31.0.2  # AWS VPC DNS — ElastiCache 등 내부 hostname 해석용
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
